services:
  absorber-api:
    build:
      context: .
      target: runtime
    image: packed-absorber-height:latest
    ports:
      - "8000:8000"
    volumes:
      # 具名卷保存已登记工况档，容器重建后仍可点名取用
      - presets_data:/data
    environment:
      PRESETS_PATH: /data/presets.json
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  presets_data:
